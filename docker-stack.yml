version: "3.8"

services:
  cca-mysql:
    image: mysql:8.0.42
    networks:
      - 6LabNet
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/cca_db_root_password
      - MYSQL_DATABASE=cca
      - MYSQL_USER=cca
      - MYSQL_PASSWORD_FILE=/run/secrets/cca_db_password
    volumes:
      - cca_mysql_data:/var/lib/mysql
    secrets:
      - cca_db_root_password
      - cca_db_password
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cca-redis:
    image: redis:7-alpine
    networks:
      - 6LabNet
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  cca-api:
    image: cca-api:latest
    networks:
      - 6LabNet
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=cca-api_cca-mysql
      - DB_PORT=3306
      - DB_NAME=cca
      - DB_USER=cca
      - REDIS_URL=redis://cca-api_cca-redis:6379
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=https://portaria.6lab.com.br
      - TZ=America/Sao_Paulo
    secrets:
      - cca_db_password
      - cca_jwt_secret
      - cca_encryption_key
      - cca_metrics_token
      - cca_twilio_auth_token
      - cca_openai_api_key
      - cca_elevenlabs_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 320M
          cpus: "0.50"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.cca-api.rule=Host(`portaria-api.6lab.com.br`)"
        - "traefik.http.routers.cca-api.entrypoints=websecure"
        - "traefik.http.routers.cca-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.cca-api.loadbalancer.server.port=3000"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  adminer:
    image: adminer:4.8.1
    networks:
      - 6LabNet
    environment:
      - ADMINER_DEFAULT_SERVER=cca-api_cca-mysql
      - ADMINER_DESIGN=dracula
    deploy:
      replicas: 0
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.cca-adminer.rule=Host(`cca-adminer.6lab.com.br`)"
        - "traefik.http.routers.cca-adminer.entrypoints=websecure"
        - "traefik.http.routers.cca-adminer.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.cca-adminer.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  cca_mysql_data:
    driver: local

networks:
  6LabNet:
    external: true

secrets:
  cca_db_password:
    external: true
  cca_db_root_password:
    external: true
  cca_jwt_secret:
    external: true
  cca_encryption_key:
    external: true
  cca_metrics_token:
    external: true
  cca_twilio_auth_token:
    external: true
  cca_openai_api_key:
    external: true
  cca_elevenlabs_api_key:
    external: true
