version: "3.8"

services:
  # Sem MySQL próprio: o portaria-api usa o MySQL já existente do guardia
  # (service guardia-api_guardia-mysql na rede 6LabNet), num database separado.
  portaria-api:
    image: portaria-api:latest
    networks:
      - 6LabNet
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=guardia-api_guardia-mysql
      - DB_PORT=3306
      - DB_NAME=portaria
      - DB_USER=portaria
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=https://central.portaria.ai
      - TZ=America/Sao_Paulo
      # URL pública (https) onde o Twilio alcança o webhook de voz
      - PUBLIC_BACKEND_URL=https://portaria-api.6lab.com.br
      # Twilio: account_sid e auth_token vêm por secret.
      # O número de origem vem do cadastro do condomínio no banco, não daqui.
      # OpenAI (a api_key vem por secret)
      - OPENAI_MODEL=gpt-4o-mini
      # ElevenLabs (a api_key vem por secret)
      - ELEVENLABS_VOICE_ID=7iqXtOF3wl3pomwXFY7G
    secrets:
      - portaria_db_password
      - portaria_jwt_secret
      - portaria_encryption_key
      - portaria_metrics_token
      - portaria_twilio_account_sid
      - portaria_twilio_auth_token
      - portaria_openai_api_key
      - portaria_elevenlabs_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 320M
          cpus: "0.50"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portaria-api.rule=Host(`portaria-api.6lab.com.br`)"
        - "traefik.http.routers.portaria-api.entrypoints=websecure"
        - "traefik.http.routers.portaria-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.portaria-api.loadbalancer.server.port=3000"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  adminer:
    image: adminer:4.8.1
    networks:
      - 6LabNet
    environment:
      - ADMINER_DEFAULT_SERVER=guardia-api_guardia-mysql
      - ADMINER_DESIGN=dracula
    deploy:
      replicas: 0
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portaria-adminer.rule=Host(`portaria-adminer.6lab.com.br`)"
        - "traefik.http.routers.portaria-adminer.entrypoints=websecure"
        - "traefik.http.routers.portaria-adminer.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.portaria-adminer.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  6LabNet:
    external: true

secrets:
  portaria_db_password:
    external: true
  portaria_jwt_secret:
    external: true
  portaria_encryption_key:
    external: true
  portaria_metrics_token:
    external: true
  portaria_twilio_account_sid:
    external: true
  portaria_twilio_auth_token:
    external: true
  portaria_openai_api_key:
    external: true
  portaria_elevenlabs_api_key:
    external: true
