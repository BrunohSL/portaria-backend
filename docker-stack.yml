version: "3.8"

services:
  portaria-mysql:
    image: mysql:8.0.42
    networks:
      - 6LabNet
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/portaria_db_root_password
      - MYSQL_DATABASE=portaria
      - MYSQL_USER=portaria
      - MYSQL_PASSWORD_FILE=/run/secrets/portaria_db_password
    volumes:
      - portaria_mysql_data:/var/lib/mysql
    secrets:
      - portaria_db_root_password
      - portaria_db_password
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  portaria-redis:
    image: redis:7-alpine
    networks:
      - 6LabNet
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  portaria-api:
    image: portaria-api:latest
    networks:
      - 6LabNet
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=portaria-api_portaria-mysql
      - DB_PORT=3306
      - DB_NAME=portaria
      - DB_USER=portaria
      - REDIS_URL=redis://portaria-api_portaria-redis:6379
      - JWT_EXPIRES_IN=24h
      - CORS_ORIGIN=https://portaria.6lab.com.br
      - TZ=America/Sao_Paulo
    secrets:
      - portaria_db_password
      - portaria_jwt_secret
      - portaria_encryption_key
      - portaria_metrics_token
      - portaria_twilio_auth_token
      - portaria_openai_api_key
      - portaria_elevenlabs_api_key
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 320M
          cpus: "0.50"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portaria-api.rule=Host(`portaria-api.6lab.com.br`)"
        - "traefik.http.routers.portaria-api.entrypoints=websecure"
        - "traefik.http.routers.portaria-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.portaria-api.loadbalancer.server.port=3000"
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  adminer:
    image: adminer:4.8.1
    networks:
      - 6LabNet
    environment:
      - ADMINER_DEFAULT_SERVER=portaria-api_portaria-mysql
      - ADMINER_DESIGN=dracula
    deploy:
      replicas: 0
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.portaria-adminer.rule=Host(`portaria-adminer.6lab.com.br`)"
        - "traefik.http.routers.portaria-adminer.entrypoints=websecure"
        - "traefik.http.routers.portaria-adminer.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.portaria-adminer.loadbalancer.server.port=8080"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

volumes:
  portaria_mysql_data:
    driver: local

networks:
  6LabNet:
    external: true

secrets:
  portaria_db_password:
    external: true
  portaria_db_root_password:
    external: true
  portaria_jwt_secret:
    external: true
  portaria_encryption_key:
    external: true
  portaria_metrics_token:
    external: true
  portaria_twilio_auth_token:
    external: true
  portaria_openai_api_key:
    external: true
  portaria_elevenlabs_api_key:
    external: true
