version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: portaria-mysql
    network_mode: "host"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-portaria_dev_2026}
      - MYSQL_DATABASE=portaria
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: portaria-redis
    network_mode: "host"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: portaria-api
    network_mode: "host"
    environment:
      - PORT=3000
      - DB_HOST=localhost
      - DB_PORT=3306
      - DB_NAME=portaria
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-portaria_dev_2026}
      - REDIS_URL=redis://localhost:6379
      - CORS_ORIGIN=http://localhost:3001
      - TZ=America/Sao_Paulo
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
